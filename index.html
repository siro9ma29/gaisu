<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>がい数れんしゅう v2.8</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2a33; --sub:#6b6875; --line:#e2d9c8;
  --main:#1f6f8b; --main-soft:#d9edf3; --ok:#2e8b57; --ok-soft:#dff3e6;
  --ng:#c8553d; --ng-soft:#fbe6e0; --hi:#f2b134; --hi-soft:#fdf0cf;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:26px;margin:8px 0 4px}
.ver{display:inline-block;font-size:13px;font-weight:700;background:var(--main-soft);color:var(--main);
  border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.lead{color:var(--sub);margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* モードえらび */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:6px}
.mode small{display:block;font-size:13px;font-weight:400;color:var(--sub)}
.mode.on{background:var(--main);border-color:var(--main);color:#fff}
.mode.on small{color:#d9edf3}

/* レベルえらび */
.levels{display:grid;gap:12px}
.level{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
.level:active{border-color:var(--main)}
.level b{font-size:20px;display:block}
.level span.d{color:var(--sub);font-size:16px}
.badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--main);color:#fff;
  display:grid;place-items:center;font-size:24px;font-weight:700}
.levels.ta .badge{background:var(--ng)}
.howto{margin-top:24px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px}
.howto ol{margin:6px 0 0;padding-left:1.4em}

/* タイムアタック */
.ready{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px 16px}
.ready h2{margin:0 0 4px;font-size:24px}
.ready ul{display:inline-block;text-align:left;margin:12px 0 0;padding-left:1.3em}
.timer{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.timer .sec{flex:none;min-width:92px;font-weight:700;color:var(--main);white-space:nowrap}
.timer .sec b{font-size:30px;font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;background:var(--main);border-radius:7px}
.timer.warn .sec{color:var(--ng)} .timer.warn .bar i{background:var(--ng)}

.count{text-align:center;font-size:140px;font-weight:700;color:var(--main);line-height:1;padding:80px 0 20px;font-variant-numeric:tabular-nums}
.count.pop{animation:pop .35s}
.countmsg{text-align:center;color:var(--sub);font-size:20px;margin:0}

/* 問題画面 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.back{border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;background:var(--card)}
.prog{font-size:15px;color:var(--sub)}
.dots{display:flex;gap:5px;margin-bottom:14px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--ok)} .dots i.miss{background:var(--hi)} .dots i.now{background:var(--main)}
.qbox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.qtext{font-size:20px;font-weight:700;margin:0 0 12px}
.qtext em{font-style:normal;background:var(--hi-soft);border-bottom:3px solid var(--hi);padding:0 4px}
.tiles{display:flex;justify-content:center;gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.tile small{font-size:13px;color:var(--sub);white-space:nowrap}
.tile .n{width:clamp(42px,13vw,74px);height:clamp(58px,17vw,96px);display:grid;place-items:center;
  font-size:clamp(34px,10vw,58px);font-weight:700;font-variant-numeric:tabular-nums;
  background:#fff;border:3px solid var(--line);border-radius:12px;transition:.15s}
.tiles.pick .tile .n{border-color:var(--main);box-shadow:0 4px 0 var(--main-soft)}
.tiles.pick .tile:active .n{transform:translateY(3px);box-shadow:none}
.tile.target .n{border-radius:50%;border:5px solid var(--ng);background:#fff}
.mark{height:clamp(30px,8vw,44px);font-size:clamp(22px,6.5vw,36px);line-height:1;font-weight:700;color:var(--ng);display:grid;place-items:center}
.slot{height:clamp(40px,11vw,62px);font-size:clamp(30px,9vw,52px);font-weight:700;color:var(--ok);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.slot.zero{color:var(--main)}
.slot.frame{width:clamp(42px,13vw,74px);border:4px solid var(--ng);border-radius:10px;background:#fff;animation:pop .35s}
.slot.pop{animation:pop .35s}
@keyframes pop{0%{transform:translateY(-14px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.btn.two{min-height:72px;font-size:34px;font-variant-numeric:tabular-nums}
.tile.shake .n{animation:shake .3s;border-color:var(--ng);background:var(--ng-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.steps{display:grid;gap:10px;margin-top:14px}
.step{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;opacity:.55}
.step.active{opacity:1;border-color:var(--main);box-shadow:0 0 0 4px var(--main-soft)}
.step.done{opacity:1}
.shead{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap}
.stitle,.sres{white-space:nowrap}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--line);color:var(--sub);
  display:grid;place-items:center;font-weight:700}
.step.active .num{background:var(--main);color:#fff}
.step.done .num{background:var(--ok);color:#fff}
.stitle{font-weight:700}
.sres{margin-left:auto;font-weight:700;color:var(--ok);text-align:right}
.sbody{margin-top:10px}
.ask{margin:0 0 10px}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn{min-height:60px;border-radius:14px;border:3px solid var(--main);background:#fff;font-size:20px;font-weight:700;
  padding:8px;box-shadow:0 4px 0 var(--main-soft);transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn small{display:block;font-size:14px;font-weight:400;color:var(--sub)}
.btn.wrong{border-color:var(--ng);background:var(--ng-soft);color:var(--ng);box-shadow:none;animation:shake .3s}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--ng-soft);color:#7d2f1f;font-size:16px}
.good{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:#1d5c39}
.next{display:block;width:100%;margin-top:14px;min-height:62px;border:0;border-radius:16px;background:var(--main);
  color:#fff;font-size:21px;font-weight:700;box-shadow:0 5px 0 #154f63}
.next:active{transform:translateY(3px);box-shadow:none}

/* レベル5・6(はんい/以上・以下・未満) */
.bigt{font-size:clamp(40px,12vw,64px);font-weight:700;color:var(--main);line-height:1.2;font-variant-numeric:tabular-nums}
.oxlist{display:grid;gap:8px}
.oxrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.oxrow.shake{animation:shake .3s;border-color:var(--ng);background:var(--ng-soft)}
.oxn{flex:1;font-size:clamp(26px,7vw,34px);font-weight:700;font-variant-numeric:tabular-nums}
.ox{flex:none;width:64px;height:54px;border-radius:12px;border:3px solid var(--main);background:#fff;font-size:30px;font-weight:700;
  box-shadow:0 4px 0 var(--main-soft);padding:0}
.ox:active{transform:translateY(3px);box-shadow:none}
.oxmark{flex:none;font-size:32px;font-weight:700} .oxmark.o{color:var(--ok)} .oxmark.x{color:var(--ng)}
.oxwhy{flex:none;color:var(--sub);font-size:15px;min-width:5.5em;text-align:right}
.btns.three{grid-template-columns:repeat(3,1fr)}
/* はんいの手順3:手順2の答え(いちばん小さい数・大きい数)を大きく見せる */
.minmax{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.minmax div{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:6px 8px;text-align:center}
.minmax small{display:block;font-size:15px;font-weight:700;color:#1d5c39}
.minmax b{display:block;font-size:clamp(36px,10vw,52px);line-height:1.15;color:var(--ok);font-variant-numeric:tabular-nums}
/* 数字のボタン(手順番号の .num とは別の名前にする) */
.btn.nbtn{font-size:26px;font-variant-numeric:tabular-nums}
.sent{font-size:clamp(18px,5vw,22px);font-weight:700;text-align:center;margin:0 0 12px;line-height:2}
.bl{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--hi);margin:0 4px;color:var(--ok)}
.prev{margin:0 0 8px;color:var(--ok);font-weight:700}
.nlbox{margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 8px 4px}
.nl{width:100%;height:auto;display:block}
.nlleg{margin:2px 0 4px;text-align:center;font-size:15px;color:var(--sub)}

/* バッジ・きろく(タイムアタック) */
.medal{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px 2px 3px;font-size:14px;font-weight:700;
  color:#fff;white-space:nowrap;vertical-align:middle;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.medal i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.35);font-size:13px}
.medal.mbig{font-size:24px;padding:6px 22px 6px 8px;margin:4px 0} .medal.mbig i{width:44px;height:44px;font-size:26px}
.m-b{background:linear-gradient(135deg,#d39a63,#8e5426)}
.m-s{background:linear-gradient(135deg,#dfe4e8,#7d8790)}
.m-g{background:linear-gradient(135deg,#f6d55c,#b8860b)}
.m-p{background:linear-gradient(135deg,#bdeef5,#7b9be0 55%,#b896e6)}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 0}
.mcell{display:flex;flex-direction:column;align-items:center;line-height:1.3}
.mcell .disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.45);filter:grayscale(1);opacity:.3;margin-bottom:2px}
.mcell b{font-size:14px;color:var(--sub)} .mcell small{font-size:13px;color:var(--sub)}
.mcell.on .disc{filter:none;opacity:1} .mcell.on b{color:var(--ink)}
.goal{margin:10px 0 0;font-weight:700;color:var(--main)}
.hist{margin:14px auto 0;max-width:340px;text-align:left}
.hist>b{display:block;font-size:15px;color:var(--sub);margin-bottom:2px}
.hrow{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:16px}
.hrow .hd{color:var(--sub);min-width:6.5em;font-variant-numeric:tabular-nums}
.hrow .hs{font-weight:700;min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.lvmedal{margin-left:auto;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lvmedal small{font-size:13px;color:var(--sub);white-space:nowrap}
.getm{margin:14px 0 0;font-size:22px;font-weight:700;color:var(--ink);animation:pop .5s}
.getm.small{font-size:18px;animation:none}

/* けっか */
.result{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:28px 16px}
.result .big{font-size:56px;font-weight:700;color:var(--main);line-height:1.2;margin:8px 0}
.result .big small{font-size:22px;color:var(--sub)}
.result .ans{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--ng-soft);color:#7d2f1f;font-size:17px}
.result .best{margin:12px 0 0;font-weight:700;color:var(--ok)}
.second{display:block;width:100%;margin-top:10px;min-height:56px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:18px}

/* タイムアタック:タブレット横画面では、スクロールしなくても操作できるように
   左=問題の数、右=手順 の2列にして、全体を1画面におさめる */
@media (orientation:landscape) and (min-width:800px){
  body.tamode .wrap{max-width:1240px;padding:10px 16px}
  body.tamode #play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"top top" "timer timer" "q steps";column-gap:16px;align-items:start}
  body.tamode #play .top{grid-area:top;margin-bottom:4px}
  body.tamode #timer{grid-area:timer;margin-bottom:8px}
  body.tamode .qbox{grid-area:q;padding:12px}
  body.tamode #stdSteps,body.tamode #xsteps{grid-area:steps;margin-top:0;gap:8px}
  body.tamode .qtext{margin-bottom:8px}
  body.tamode .step{padding:8px 12px}
  body.tamode .num{width:34px;height:34px}
  body.tamode .sbody{margin-top:6px}
  body.tamode .ask{margin-bottom:8px;line-height:1.45}
  body.tamode .btn.two{min-height:64px}
  /* レベル5・6 */
  body.tamode .bigt{font-size:clamp(40px,9vh,64px)}
  body.tamode .oxlist{gap:6px}
  body.tamode .oxrow{padding:3px 10px}
  body.tamode .oxn{font-size:28px}
  body.tamode .ox{height:46px}
  body.tamode .minmax{margin-bottom:8px}
  body.tamode .minmax b{font-size:clamp(30px,7vh,46px)}
  body.tamode .sent{margin-bottom:8px;line-height:1.8}
  body.tamode .btn{min-height:54px}
  body.tamode #xend .good{margin-top:8px}
  body.tamode .nlbox{margin-top:8px}
}
/* 高さが低い横画面では、数字のマスも小さくする */
@media (orientation:landscape) and (min-width:800px) and (max-height:760px){
  body.tamode .tile .n{height:clamp(58px,13vh,96px)}
  body.tamode .mark{height:clamp(28px,6vh,44px)}
  body.tamode .slot{height:clamp(36px,8vh,62px)}
}
@media (orientation:landscape) and (min-width:800px) and (max-height:660px){
  body.tamode .wrap{padding-top:6px;padding-bottom:6px}
  body.tamode #timer{margin-bottom:6px}
  body.tamode .oxrow{padding:2px 10px}
  body.tamode .ox{height:42px}
  body.tamode .oxn{font-size:26px}
  body.tamode .btn{min-height:50px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- レベルえらび -->
  <section id="home">
    <h1>がい数れんしゅう<span class="ver" id="ver"></span></h1>
    <p class="lead" id="lead"></p>
    <div class="modes">
      <button class="mode on" data-mode="basic">きほんモード<small>じっくり10問</small></button>
      <button class="mode" data-mode="ta">タイムアタック<small>60秒で何問?</small></button>
    </div>
    <div class="levels" id="levels">
      <button class="level" data-level="1"><span class="badge">1</span><span><b>千の位までのがい数</b><span class="d">4けたの数を、千の位までのがい数にする</span></span></button>
      <button class="level" data-level="2"><span class="badge">2</span><span><b>いろいろな位までのがい数</b><span class="d">百の位まで・千の位まで・一万の位まで</span></span></button>
      <button class="level" data-level="3"><span class="badge">3</span><span><b>上から○けたのがい数</b><span class="d">上から1けた・上から2けたのがい数にする</span></span></button>
      <button class="level" data-level="4"><span class="badge">4</span><span><b>ミックス</b><span class="d">レベル1〜3の問題が、まざって出る</span></span></button>
      <button class="level" data-level="5"><span class="badge">5</span><span><b>以上・以下・未満</b><span class="d">ことばの意味をおぼえて、入る数をはんだんする</span></span></button>
      <button class="level" data-level="6"><span class="badge">6</span><span><b>がい数のはんい</b><span class="d">百の位までのがい数にすると300になる整数は?</span></span></button>
    </div>
    <div class="howto">
      <b>がい数のもとめ方</b>
      <ol>
        <li>四捨五入する位を見つける</li>
        <li>切り捨てか切り上げか、はんだんする</li>
        <li>0になる位に0を書く</li>
        <li>のこった位の数字をきめて、がい数で表す</li>
      </ol>
    </div>
  </section>

  <!-- タイムアタックのじゅんび -->
  <section id="ready" class="hidden">
    <div class="top"><button class="back" id="backBtn2">← レベルをえらぶ</button></div>
    <div class="ready">
      <h2>タイムアタック</h2>
      <p style="margin:0;color:var(--sub)" id="readyLv"></p>
      <ul>
        <li>60秒で何問とけるかチャレンジ!</li>
        <li id="readyMD">「ま」「で」も自分でつけよう</li>
        <li>1回でもまちがえたら、そこでおわり</li>
      </ul>
      <p class="best" id="readyBest" style="margin:12px 0 0;font-weight:700;color:var(--ok)"></p>
      <div class="medals" id="readyMedals"></div>
      <p class="goal" id="readyGoal"></p>
      <div class="hist" id="readyHist"></div>
    </div>
    <button class="next" id="goBtn">スタート!</button>
  </section>

  <!-- タイムアタックのカウントダウン -->
  <section id="count" class="hidden">
    <p class="count" id="countNum">3</p>
    <p class="countmsg">よーい…</p>
  </section>

  <!-- 問題 -->
  <section id="play" class="hidden">
    <div class="top">
      <button class="back" id="backBtn">← レベルをえらぶ</button>
      <span class="prog" id="prog"></span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="timer hidden" id="timer">
      <span class="sec">のこり <b id="tsec">60</b> 秒</span>
      <span class="bar"><i id="tbar"></i></span>
    </div>

    <div class="qbox">
      <p class="qtext" id="qtext"></p>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="steps hidden" id="xsteps">
      <div class="step" id="x1"><div class="shead"><span class="num">01</span><span class="stitle" id="xt1"></span><span class="sres" id="xr1"></span></div><div class="sbody" id="xb1"></div></div>
      <div class="step" id="x2"><div class="shead"><span class="num">02</span><span class="stitle" id="xt2"></span><span class="sres" id="xr2"></span></div><div class="sbody" id="xb2"></div></div>
      <div class="step" id="x3"><div class="shead"><span class="num">03</span><span class="stitle" id="xt3"></span><span class="sres" id="xr3"></span></div><div class="sbody" id="xb3"></div></div>
      <div id="xend"></div>
    </div>

    <div class="steps" id="stdSteps">
      <div class="step hidden" id="s0">
        <div class="shead"><span class="num">★</span><span class="stitle">「ま」「で」をつける</span><span class="sres" id="r0"></span></div>
        <div class="sbody" id="b0"></div>
      </div>
      <div class="step" id="s1">
        <div class="shead"><span class="num">01</span><span class="stitle">四捨五入する位を見つける</span><span class="sres" id="r1"></span></div>
        <div class="sbody" id="b1"></div>
      </div>
      <div class="step" id="s2">
        <div class="shead"><span class="num">02</span><span class="stitle">切り捨て? 切り上げ?</span><span class="sres" id="r2"></span></div>
        <div class="sbody" id="b2"></div>
      </div>
      <div class="step" id="s3">
        <div class="shead"><span class="num">03</span><span class="stitle">0になる位に0を書く</span><span class="sres" id="r3"></span></div>
        <div class="sbody" id="b3"></div>
      </div>
      <div class="step" id="s4">
        <div class="shead"><span class="num">04</span><span class="stitle">がい数で表す</span><span class="sres" id="r4"></span></div>
        <div class="sbody" id="b4"></div>
      </div>
    </div>
    <button class="next hidden" id="nextBtn">つぎの問題へ →</button>
  </section>

  <!-- けっか -->
  <section id="done" class="hidden">
    <div class="result">
      <p id="doneMsg" style="font-size:22px;font-weight:700;margin:0"></p>
      <p class="big"><span id="doneScore"></span><small id="doneUnit"></small></p>
      <p style="color:var(--sub);margin:0" id="doneNote"></p>
      <p class="ans hidden" id="doneAns"></p>
      <p class="best hidden" id="doneBest"></p>
      <div class="hidden" id="doneMedal"></div>
    </div>
    <button class="next" id="againBtn">同じレベルでもう一度</button>
    <button class="second" id="homeBtn">レベルをえらぶ</button>
  </section>
</div>

<script>
(function(){
"use strict";
var VERSION='v2.9';   // バージョン番号(ここを書きかえると、バッジも変わる)
var LIMIT=60;         // タイムアタックの秒数
var PLACE=['一','十','百','千','一万','十万','百万'];
var LNAME={1:'千の位までのがい数',2:'いろいろな位までのがい数',3:'上から○けたのがい数',4:'ミックス',5:'以上・以下・未満',6:'がい数のはんい'};
var TOTAL=10;
var SELF=4;          // きほんモードで、さいごの何問を「ま」「で」も自分でつける問題にするか(タイムアタックは全問)
// きほんモードで、はじめに出す決まった問題(レベル1はスライドの例題)
var FIXED={
  1:[{n:1380,p:3},{n:1640,p:3}],
  2:[{n:2470,p:2},{n:38500,p:3}],
  3:[{n:4360,k:1},{n:7281,k:2}],
  4:[]
};
var st={mode:'basic',level:1,idx:0,score:0,log:[],q:null,step:1,missed:false,run:false,end:0,tick:null,adv:null};
var $=function(id){return document.getElementById(id)};
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pow(e){return Math.pow(10,e)}

function makeQ(level,idx){
  if(level===4) return makeQ(rnd(1,3),99); // レベル4は、レベル1〜3からランダム
  var f=FIXED[level][idx], n, p, k=0, d;
  if(f){ n=f.n; if(f.k){k=f.k;p=String(n).length-k}else p=f.p; }
  else if(level===1){ p=3; do{n=rnd(1000,9999)}while(n%1000===0); }
  else if(level===2){
    p=rnd(2,4); d=Math.min(6,Math.max(4,p+1+rnd(0,2)));
    do{n=rnd(pow(d-1),pow(d)-1)}while(n%pow(p)===0);
  }else{
    k=rnd(1,2); d=rnd(Math.max(3,k+1),6); p=d-k;
    do{n=rnd(pow(d-1),pow(d)-1)}while(n%pow(p)===0);
  }
  var r=p-1, digit=Math.floor(n/pow(r))%10, pd=Math.floor(n/pow(p))%10, up=digit>=5;
  if(pd===9) return makeQ(level,99); // もとめる位が9の問題は出さない(2たくが 9と10 になってしまうため)
  var base=Math.floor(n/pow(p))*pow(p);
  return {n:n,p:p,r:r,k:k,digit:digit,pd:pd,up:up,ad:up?pd+1:pd,ans:up?base+pow(p):base};
}
function target(q){return q.k?'上から'+q.k+'けた':PLACE[q.p]+'の位まで'}

// ===== レベル5・6 =====
// 問題は「手順(steps)」のならび。type:'ox'=数ごとに○×、type:'pick'=ボタンからえらぶ(asksを順に)
function r100(x){return Math.round(x/100)*100}
function sortN(a){return a.sort(function(x,y){return x-y})}

// レベル6:百の位までのがい数にすると T になる整数(1問目は300、7問目からは4けた)
// 表し方は「以上・未満」と「以上・以下」の2しゅるい(1問目=未満、2問目=以下、そのあとはランダム)
function makeHani(idx){
  var T=(idx===0)?300:(idx<6||st.mode==='ta'&&rnd(0,1))?rnd(2,9)*100:(function(){var t;do{t=rnd(11,99)*100}while(t%1000===0);return t})();
  var lo=T-50, hi=T+49, items, oks;
  var LT=idx===0?true:idx===1?false:rnd(0,1)===0; // true=以上・未満、false=以上・以下
  var up=LT?hi+1:hi, W=LT?'未満':'以下';
  do{ // さかいめの数を必ず入れて、○も×も出るようにする
    var pool=[lo-1,lo,hi,hi+1,T-rnd(1,45),T+rnd(1,45),T-rnd(51,95),T+rnd(51,95)];
    items=[rnd(0,1)?lo-1:lo, rnd(0,1)?hi:hi+1];
    while(items.length<4){var v=pool[rnd(0,pool.length-1)]; if(items.indexOf(v)<0) items.push(v)}
    oks=items.filter(function(x){return r100(x)===T}).length;
  }while(oks===0||oks===4);
  sortN(items);
  var why=function(n){var d=Math.floor(n/10)%10;return n+' の十の位は '+d+'。'+(d>=5?'切り上げ':'切り捨て')+'て、'+r100(n)+' になるよ。'};
  return {x:6,
    text:'十の位を四捨五入して、<em>百の位までのがい数</em>にすると '+T+' になる整数を考えよう。',
    show:'<div class="bigt">'+T+'</div><small style="color:var(--sub)">になる整数は?</small>',
    steps:[
      {title:T+' になる? ならない?',type:'ox',
       ask:'それぞれの数を百の位までのがい数にすると、<b>'+T+'</b> になるかな? なるなら○、ならないなら×をえらぼう。',
       items:items.map(function(n){return {n:n,ok:r100(n)===T,note:'→ '+r100(n)}}), why:why, res:'できた'},
      {title:'いちばん小さい数・大きい数',type:'pick',asks:[
        {q:T+' になる整数のうち、<b>いちばん小さい数</b>はどれかな?',ch:[T-100,lo-1,lo],ans:lo,done:'小さい数は '+lo},
        {q:'では、<b>いちばん大きい数</b>はどれかな?',ch:[hi,hi+1,T+99],ans:hi,done:'大きい数は '+hi}],
       why:function(c){return c+' を百の位までのがい数にすると '+r100(c)+' になるから、'+T+' にはならないよ。'},
       res:function(){return lo+' 〜 '+hi}},
      {title:LT?'「以上」「未満」で表す':'「以上」「以下」で表す',type:'pick',
       top:function(){return '<div class="minmax"><div><small>いちばん小さい数</small><b>'+lo+'</b></div><div><small>いちばん大きい数</small><b>'+hi+'</b></div></div>'},
       sent:function(a){return T+' になる整数は、<br>'+lo+'<span class="bl">'+(a[0]||'?')+'</span> '+up+'<span class="bl">'+(a[1]||'?')+'</span>'},
       asks:[
        {q:lo+' は '+T+' になる数に<b>入る</b>ね。'+lo+' のあとに入ることばは?',ch:['以上','未満'],ans:'以上',
         why:lo+' は入る数だね。その数を<b>ふくむ</b>ときは「以上」をつかうよ。'},
        LT
        ? {q:(hi+1)+' は '+T+' になるかな? '+(hi+1)+' のあとに入ることばは?',ch:['以下','未満'],ans:'未満',
           why:(hi+1)+' は四捨五入すると '+(T+100)+' になるから、入らないね。その数を<b>ふくまない</b>ときは「未満」をつかうよ。'}
        : {q:hi+' は '+T+' になる数に<b>入る</b>ね。'+hi+' のあとに入ることばは?',ch:['以下','未満'],ans:'以下',
           why:hi+' は入る数だね。その数を<b>ふくむ</b>ときは「以下」をつかうよ。'}],
       res:function(){return lo+'以上 '+up+W}}
    ],
    nl:{a:lo,ac:true,b:up,bc:!LT,mid:T},
    good:'<b>正かい!</b> '+T+' になる整数は、<b>'+lo+' 以上 '+up+' '+W+'</b>。'+lo+' から '+hi+' までの数だよ。'+
      (LT?'(「'+lo+' 以上 '+hi+' 以下」と表すこともできるよ)':'(「'+lo+' 以上 '+(hi+1)+' 未満」と表すこともできるよ)'),
    ansText:T+' になる整数のはんいは <b>'+lo+' 以上 '+up+' '+W+'</b>('+lo+' から '+hi+' まで)'};
}

// レベル5:以上・以下・未満(7問目からは「○以上○未満」などのはんい)
var W6={ge:'以上',le:'以下',lt:'未満'}, INC6={ge:true,le:true,lt:false};
var RULE6={ge:'「以上」は、その数と、それより大きい数のこと。その数を<b>ふくむ</b>よ。',
  le:'「以下」は、その数と、それより小さい数のこと。その数を<b>ふくむ</b>よ。',
  lt:'「未満」は、その数より小さい数のこと。その数は<b>ふくまない</b>よ。'};
var FIXED6=[{k:'ge',a:50},{k:'lt',a:50}];
function makeIjo(idx){
  var range=st.mode==='ta'?rnd(0,2)===0:idx>=6, f=st.mode==='ta'?null:FIXED6[idx];
  var a,b,k,k2,cond,items,inside,why,s1,good,nl;
  if(!range){
    k=f?f.k:['ge','le','lt'][rnd(0,2)]; a=f?f.a:rnd(2,19)*5; cond=a+W6[k];
    inside=function(n){return k==='ge'?n>=a:k==='le'?n<=a:n<a};
    var far=a+(rnd(0,1)?1:-1)*rnd(3,9);
    items=sortN([a-1,a,a+1,far]);
    why=function(n){return n+' は '+a+(n===a?' と同じ数':n>a?' より大きい数':' より小さい数')+'。'+RULE6[k]};
    s1=[{q:'「'+cond+'」は、'+a+' を ふくむ? ふくまない?',ch:['ふくむ','ふくまない'],ans:INC6[k]?'ふくむ':'ふくまない',
         done:a+' を'+(INC6[k]?'ふくむ':'ふくまない'),why:RULE6[k]}];
    good='<b>正かい!</b> 「'+cond+'」は、'+(k==='ge'?a+' と、'+a+' より大きい数':k==='le'?a+' と、'+a+' より小さい数':a+' より小さい数('+a+' は入らない)')+'。';
    nl={a:a,ac:INC6[k],dir:k==='ge'?'r':'l'};
  }else{
    a=rnd(1,8)*10; b=a+rnd(1,4)*10; k2=rnd(0,1)?'lt':'le'; cond=a+'以上'+b+W6[k2];
    inside=function(n){return n>=a&&(k2==='lt'?n<b:n<=b)};
    var mid=rnd(0,1)?b-1:a+rnd(2,b-a-2);
    items=sortN([a-1,a,mid,b,b+1]);
    why=function(n){
      if(n<a) return n+' は '+a+' より小さいから、入らないよ。';
      if(n===a) return '「'+a+'以上」だから、'+a+' はふくむよ。';
      if(n<b) return n+' は '+a+' より大きくて '+b+' より小さいから、入るよ。';
      if(n===b) return '「'+b+W6[k2]+'」だから、'+b+' は'+(k2==='lt'?'ふくまない':'ふくむ')+'よ。';
      return n+' は '+b+' より大きいから、入らないよ。';
    };
    s1=[{q:'「'+cond+'」は、'+a+' を ふくむ? ふくまない?',ch:['ふくむ','ふくまない'],ans:'ふくむ',done:a+' をふくむ',why:RULE6.ge},
        {q:'では、'+b+' を ふくむ? ふくまない?',ch:['ふくむ','ふくまない'],ans:INC6[k2]?'ふくむ':'ふくまない',
         done:b+' を'+(INC6[k2]?'ふくむ':'ふくまない'),why:RULE6[k2]}];
    good='<b>正かい!</b> 「'+cond+'」には、'+a+' は入って、'+b+' は'+(k2==='lt'?'入らない':'入る')+'。';
    nl={a:a,ac:true,b:b,bc:k2==='le'};
  }
  return {x:5,
    text:'「<em>'+cond+'</em>」の数について考えよう。',
    show:'<div class="bigt">'+cond+'</div>',
    steps:[
      {title:'ふくむ? ふくまない?',type:'pick',asks:s1,res:function(){return s1.map(function(s){return s.done}).join('・')}},
      {title:'「'+cond+'」に入る?',type:'ox',
       ask:'つぎの数は「<b>'+cond+'</b>」に入るかな? 入るなら○、入らないなら×をえらぼう。',
       items:items.map(function(n){return {n:n,ok:inside(n),note:inside(n)?'入る':'入らない'}}), why:why, res:'できた'}
    ],
    nl:nl, good:good, ansText:good.replace(/<[^>]+>/g,'').replace('正かい! ','')};
}

// 数直線(●=ふくむ ○=ふくまない)
function numLine(o){
  var two=o.b!==undefined, xa=two?160:300, xb=440, x0, x1, h='', C='var(--ng)';
  if(two){x0=xa;x1=xb}else if(o.dir==='r'){x0=xa;x1=572}else{x0=28;x1=xa}
  h+='<line x1="12" y1="36" x2="588" y2="36" style="stroke:var(--sub);stroke-width:2"/>';
  h+='<line x1="'+x0+'" y1="36" x2="'+x1+'" y2="36" style="stroke:'+C+';stroke-width:9;stroke-linecap:round"/>';
  if(!two) h+=o.dir==='r'?'<polygon points="572,24 594,36 572,48" style="fill:'+C+'"/>':'<polygon points="28,24 6,36 28,48" style="fill:'+C+'"/>';
  var dot=function(x,c,lab){return '<circle cx="'+x+'" cy="36" r="10" style="fill:'+(c?C:'#fff')+';stroke:'+C+';stroke-width:4"/>'+
    '<text x="'+x+'" y="76" text-anchor="middle" style="fill:var(--ink);font-size:22px;font-weight:700">'+lab+'</text>'};
  if(o.mid!==undefined) h+='<line x1="300" y1="28" x2="300" y2="44" style="stroke:var(--ink);stroke-width:2"/><text x="300" y="76" text-anchor="middle" style="fill:var(--sub);font-size:18px">('+o.mid+')</text>';
  h+=dot(xa,o.ac,o.a); if(two) h+=dot(xb,o.bc,o.b);
  return '<div class="nlbox"><svg class="nl" viewBox="0 0 600 86" role="img" aria-label="数直線">'+h+'</svg><p class="nlleg">● … その数をふくむ ○ … その数をふくまない</p></div>';
}

function renderX(){
  var q=st.q;
  [0,1,2].forEach(function(i){
    var S=q.steps[i], el=$('x'+(i+1));
    el.classList.toggle('hidden',!S); if(!S) return;
    el.classList.toggle('active',st.xs===i); el.classList.toggle('done',st.xs>i);
    $('xt'+(i+1)).innerHTML=S.title;
    $('xr'+(i+1)).textContent=st.xs>i?(typeof S.res==='function'?S.res():S.res):'';
    var b=$('xb'+(i+1)); if(st.xs!==i){b.innerHTML='';return}
    var h='';
    if(S.type==='ox'){
      h+='<p class="ask">'+S.ask+'</p><div class="oxlist">';
      S.items.forEach(function(it,j){
        h+='<div class="oxrow" data-row="'+j+'"><span class="oxn">'+it.n+'</span>'+(st.xd[j]
          ? '<span class="oxmark '+(it.ok?'o':'x')+'">'+(it.ok?'○':'×')+'</span><span class="oxwhy">'+it.note+'</span>'
          : '<button class="ox" data-j="'+j+'" data-v="1">○</button><button class="ox" data-j="'+j+'" data-v="0">×</button>')+'</div>';
      });
      h+='</div>';
    }else{
      if(S.top) h+=S.top();
      if(S.sent) h+='<p class="sent">'+S.sent(st.xp)+'</p>';
      else for(var p=0;p<st.xa;p++) h+='<p class="prev">✓ '+S.asks[p].done+'</p>';
      var A=S.asks[st.xa];
      h+='<p class="ask">'+A.q+'</p><div class="btns'+(A.ch.length===3?' three':'')+'">';
      A.ch.forEach(function(c,j){h+='<button class="btn'+(typeof c==='number'?' nbtn':'')+'" data-c="'+j+'">'+c+'</button>'});
      h+='</div>';
    }
    b.innerHTML=h+'<div id="hint"></div>';
  });
}
function nextX(){
  st.xs++; st.xa=0; st.xp=[];
  if(st.xs>=st.q.steps.length){ renderX(); $('xend').innerHTML='<p class="good">'+st.q.good+'</p>'+numLine(st.q.nl); afterSolve(); }
  else renderX();
}

// --- じこベスト(タイムアタック)。保存できない端末でも動く ---
// v2.7でレベル5と6を入れかえたので、保存先の番号も入れかえて、これまでのきろくをひきつぐ
var BKEY={1:1,2:2,3:3,4:4,5:6,6:5};
function getBest(level){try{return +localStorage.getItem('gaisu_ta_best_'+BKEY[level])||0}catch(e){return 0}}
function setBest(level,v){try{localStorage.setItem('gaisu_ta_best_'+BKEY[level],v)}catch(e){}}

// --- きろく(タイムアタックのりれき)。レベルごとに新しい順で30回分まで保存 ---
var LOGMAX=30;
function getLog(level){try{var a=JSON.parse(localStorage.getItem('gaisu_ta_log_'+BKEY[level])||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function addLog(level,s){var a=getLog(level);a.unshift({t:Date.now(),s:s});a=a.slice(0,LOGMAX);try{localStorage.setItem('gaisu_ta_log_'+BKEY[level],JSON.stringify(a))}catch(e){}}
function fmtDate(t){var d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)}

// --- バッジ(何問とけたらもらえるか) ---
var MEDALS=[{n:10,name:'ブロンズ',k:'m-b'},{n:20,name:'シルバー',k:'m-s'},{n:30,name:'ゴールド',k:'m-g'},{n:40,name:'プラチナ',k:'m-p'}];
function medalOf(s){var m=null;MEDALS.forEach(function(x){if(s>=x.n)m=x});return m}
function nextMedal(s){for(var i=0;i<MEDALS.length;i++){if(s<MEDALS[i].n)return MEDALS[i]}return null}
function medalHTML(m,big){return '<span class="medal '+m.k+(big?' mbig':'')+'"><i>★</i>'+m.name+'</span>'}
function goalText(best){var nx=nextMedal(best);return nx?'あと <b>'+(nx.n-best)+'問</b> で '+nx.name+'バッジ!':'プラチナバッジ たっせい! すごい!'}

// レベルえらびの画面に、タイムアタックのバッジとベストを出す
function refreshMedals(){
  document.querySelectorAll('.level').forEach(function(btn){
    var sp=btn.querySelector('.lvmedal');
    if(!sp){sp=document.createElement('span');sp.className='lvmedal';btn.appendChild(sp)}
    var lv=+btn.dataset.level, b=getBest(lv), m=medalOf(b);
    sp.innerHTML=st.mode==='ta'&&b?(m?medalHTML(m):'')+'<small>ベスト '+b+'問</small>':'';
  });
}
// じゅんび画面:ベスト・バッジ一覧・つぎの目標・さいきんのきろく
function readyInfo(level){
  var b=getBest(level), log=getLog(level);
  $('readyBest').textContent=b?'これまでのベスト: '+b+'問':'まだきろくがないよ。チャレンジしよう!';
  $('readyMedals').innerHTML=MEDALS.map(function(x){
    return '<div class="mcell'+(b>=x.n?' on':'')+'"><span class="disc '+x.k+'">★</span><b>'+x.name+'</b><small>'+x.n+'問</small></div>'}).join('');
  $('readyGoal').innerHTML=goalText(b);
  $('readyHist').innerHTML=log.length?'<b>さいきんのきろく</b>'+log.slice(0,5).map(function(r){var m=medalOf(r.s);
    return '<div class="hrow"><span class="hd">'+fmtDate(r.t)+'</span><span class="hs">'+r.s+'問</span>'+(m?medalHTML(m):'')+'</div>'}).join(''):'';
}

function stopTA(){st.run=false;clearInterval(st.tick);clearTimeout(st.adv)}
function show(id){
  if(id!=='play') stopTA();
  if(id==='home') refreshMedals();
  ['home','ready','count','play','done'].forEach(function(s){$(s).classList.toggle('hidden',s!==id)});window.scrollTo(0,0);
}

function start(level){
  stopTA(); st.level=level; st.idx=0; st.score=0; st.log=[];
  if(st.mode==='ta'){
    $('readyLv').textContent='レベル'+level+' ・ '+LNAME[level];
    readyInfo(level);
    $('readyMD').classList.toggle('hidden',level>=5);
    show('ready');
  }else{ playUI(); show('play'); newQ(); }
}
function playUI(){
  var ta=st.mode==='ta';
  document.body.classList.toggle('tamode',ta); // 横画面で2列にする(CSS)
  $('dots').classList.toggle('hidden',ta); $('timer').classList.toggle('hidden',!ta);
  // タイムアタックでは「切り捨て? 切り上げ?」の手順を出さない
  $('s2').classList.toggle('hidden',ta);
  document.querySelector('#s3 .num').textContent=ta?'02':'03';
  document.querySelector('#s4 .num').textContent=ta?'03':'04';
}
function go(){ // タイムアタック:3秒前からカウントダウン
  show('count'); var n=3;
  (function step(){
    if(n===0){ begin(); return; }
    var c=$('countNum'); c.textContent=n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    n--; st.adv=setTimeout(step,1000);
  })();
}
function begin(){ // タイムアタック開始
  st.idx=0; st.score=0; playUI(); show('play');
  st.run=true; st.end=Date.now()+LIMIT*1000; tick(); st.tick=setInterval(tick,100);
  newQ();
}
function tick(){
  var left=st.end-Date.now();
  if(left<=0){ endTA(true); return; }
  $('tsec').textContent=Math.ceil(left/1000);
  $('tbar').style.width=(left/LIMIT/10)+'%';
  $('timer').classList.toggle('warn',left<=10000);
}
function endTA(timeup){
  var q=st.q, best=getBest(st.level);
  stopTA();
  $('doneMsg').textContent=timeup?'タイムアップ!':'ざんねん! まちがえたので、ここまで。';
  $('doneScore').textContent=st.score; $('doneUnit').textContent=' 問';
  $('doneNote').textContent='レベル'+st.level+' ・ '+LIMIT+'秒タイムアタックでとけた問題の数';
  var a=$('doneAns'); a.classList.toggle('hidden',timeup);
  if(!timeup) a.innerHTML='まちがえた問題:<br>'+(q.x?q.ansText:'<b>'+q.n+'</b> を '+target(q)+'のがい数にすると <b>'+q.ans+'</b>');
  var b=$('doneBest'); b.classList.remove('hidden');
  if(st.score>best){ setBest(st.level,st.score); b.textContent='新きろく!'+(best?'(これまでのベスト: '+best+'問)':''); }
  else b.textContent=best?'これまでのベスト: '+best+'問':'';
  // きろくを保存して、バッジを出す
  addLog(st.level,st.score);
  var nb=Math.max(best,st.score), oldM=medalOf(best), newM=medalOf(nb), m=medalOf(st.score), h='';
  if(newM&&(!oldM||newM.n>oldM.n)) h='<p class="getm">'+medalHTML(newM,true)+'<br>'+newM.name+'バッジ ゲット!</p>';
  else if(m) h='<p class="getm small">こんかいは '+medalHTML(m)+'</p>';
  h+='<p class="goal">'+goalText(nb)+'</p>';
  var dm=$('doneMedal'); dm.innerHTML=h; dm.classList.remove('hidden');
  show('done');
}

function newQ(){
  var ta=st.mode==='ta', X=st.level>=5;
  $('stdSteps').classList.toggle('hidden',X); $('xsteps').classList.toggle('hidden',!X); $('xend').innerHTML='';
  if(X){ // レベル5・6
    st.q=(st.level===5?makeIjo:makeHani)(ta?99:st.idx); st.missed=false; st.step=99; st.xs=0; st.xa=0; st.xd=[]; st.xp=[];
    progUI(); $('nextBtn').classList.add('hidden');
    $('qtext').innerHTML=st.q.text; var t=$('tiles'); t.classList.remove('pick'); t.innerHTML='<div>'+st.q.show+'</div>';
    renderX(); return;
  }
  st.q=makeQ(st.level,ta?99:st.idx); st.missed=false;
  // タイムアタックは全問、きほんモードは後半だけ「ま」「で」を自分でつける(md: 0=「ま」まち 1=「で」まち 2=ついている)
  st.self=ta||st.idx>=TOTAL-SELF; st.step=st.self?0:1; st.md=st.self?0:2;
  $('s0').classList.toggle('hidden',!st.self);
  var q=st.q;
  progUI();
  $('qtext').innerHTML=q.n+' を、<em>'+target(q)+'</em>のがい数にしましょう。';
  $('nextBtn').classList.add('hidden');
  ['r0','r1','r2','r3','r4','b0','b1','b2','b3','b4'].forEach(function(id){$(id).innerHTML=''});
  renderTiles(); renderStep();
}

function progUI(){
  if(st.mode==='ta'){
    $('prog').textContent='レベル'+st.level+' ・ '+st.score+'問クリア';
  }else{
    $('prog').textContent='レベル'+st.level+' ・ '+(st.idx+1)+' / '+TOTAL+'問目';
    var dots='';for(var i=0;i<TOTAL;i++){dots+='<i class="'+(i<st.idx?(st.log[i]?'done':'miss'):(i===st.idx?'now':''))+'"></i>'}
    $('dots').innerHTML=dots;
  }
}

function renderTiles(){
  var q=st.q, s=String(q.n), h='';
  for(var i=0;i<s.length;i++){
    var e=s.length-1-i, slot='', sc='';
    // 「ま」=もとめる位、「で」=その1つ下の位(四捨五入する位)
    var mark=e===q.p?(st.md>=1?'ま':''):(e===q.r?(st.md>=2?'で':''):'');
    // 0は、四捨五入する数をタップしたと同時に、数の下に出す
    if(st.step>=2&&e<q.p){slot='0';sc=' zero'+(st.step===2||(st.mode==='ta'&&st.step===4)?' pop':'')}
    else if(st.step===4&&e===q.p){sc=' frame'} // どの位の数をえらぶのか、赤わくでしめす
    else if(st.step===5&&e===q.p){slot=q.ad;sc=' pop'}
    else if(st.step===5&&e>q.p){slot=s[i]}
    h+='<button class="tile'+(st.step>1&&e===q.r?' target':'')+'" data-e="'+e+'"><span class="mark">'+mark+'</span><small>'+PLACE[e]+'の位</small><span class="n">'+s[i]+'</span><span class="slot'+sc+'">'+slot+'</span></button>';
  }
  var t=$('tiles'); t.innerHTML=h; t.classList.toggle('pick',st.step<=1);
}

function renderStep(){
  var q=st.q;
  [0,1,2,3,4].forEach(function(i){
    var el=$('s'+i); el.classList.toggle('active',st.step===i);
    el.classList.toggle('done',st.step>i||(i===3&&st.step>=2)); // 0は手順1のタップと同時に書かれる
    if(st.step!==i) $('b'+i).innerHTML='';
  });
  if(st.step===0){
    $('b0').innerHTML='<p class="ask">'+(st.md===0
      ? '<b>'+target(q)+'</b>のがい数だね。「<b>ま</b>」をつける数字をタップしよう。'
      : 'つぎに、「<b>で</b>」をつける数字をタップしよう。'+(st.mode==='ta'?'(「で」が四捨五入する位だよ)':''))+'</p><div id="hint"></div>';
  }else if(st.self) $('r0').textContent='「ま」「で」をつけた';
  if(st.step>=2){
    $('r1').textContent=PLACE[q.r]+'の位の '+q.digit;
    $('r3').textContent=PLACE[q.r]+'の位'+(q.r>0?'から下':'')+'は 0';
  }
  if(st.step===1){
    $('b1').innerHTML='<p class="ask">上の数字の中から、<b>四捨五入する位の数字</b>をタップしよう。</p><div id="hint"></div>';
  }else if(st.step===2){
    $('b2').innerHTML='<p class="ask">'+PLACE[q.r]+'の位の数字は <b>'+q.digit+'</b>。0〜4かな、5〜9かな?</p>'+
      '<div class="btns"><button class="btn" data-up="0">切り捨て<small>0・1・2・3・4</small></button>'+
      '<button class="btn" data-up="1">切り上げ<small>5・6・7・8・9</small></button></div><div id="hint"></div>';
  }else if(st.step===4){
    var ta=st.mode==='ta';
    if(!ta) $('r2').textContent=q.up?'5〜9。切り上げ。':'0〜4。切り捨て。';
    // もとめる位の数字を2たくでえらぶ(そのまま か 1ふやす か)
    var pad='';[q.pd,q.pd+1].forEach(function(d){pad+='<button class="btn two" data-d="'+d+'">'+d+'</button>'});
    $('b4').innerHTML='<p class="ask">'+(ta?'':(q.up?'切り上げ':'切り捨て')+'だから、')+'<b>'+PLACE[q.p]+'の位</b>の数字は、どちらになるかな?</p><div class="btns">'+pad+'</div><div id="hint"></div>';
  }
}

// まちがえたとき。タイムアタックでは、そこで終了
function hint(msg){
  if(st.mode==='ta'){
    st.step=9; stopTA();
    st.adv=setTimeout(function(){endTA(false)},700);
    return;
  }
  st.missed=true;var h=$('hint');if(h)h.innerHTML='<p class="hint">'+msg+'</p>';
}

function finishQ(){
  var q=st.q, how=(q.up?PLACE[q.p]+'の位に1をたして '+q.ad+'。':PLACE[q.p]+'の位は '+q.ad+' のまま。')+PLACE[q.r]+'の位'+(q.r>0?'から下':'')+'は0。';
  st.step=5; renderTiles(); renderStep();
  $('r4').textContent='答えは '+q.ans;
  $('b4').innerHTML='<p class="good"><b>正かい!</b> '+how+'</p>';
  afterSolve();
}
function afterSolve(){ // 1問とけたあと(全レベル共通)
  if(st.mode==='ta'){ // 自動でつぎの問題へ
    st.score++; st.idx++;
    $('prog').textContent='レベル'+st.level+' ・ '+st.score+'問クリア';
    st.adv=setTimeout(function(){ if(st.run){ newQ(); window.scrollTo(0,0); } },700);
    return;
  }
  st.log[st.idx]=!st.missed; if(!st.missed) st.score++;
  var d=$('dots').children[st.idx]; d.className=st.missed?'miss':'done';
  var nb=$('nextBtn'); nb.textContent=st.idx+1<TOTAL?'つぎの問題へ →':'けっかを見る →'; nb.classList.remove('hidden');
  nb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// --- 操作 ---
function setMode(m){
  st.mode=m;
  document.querySelectorAll('.mode').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  $('levels').classList.toggle('ta',m==='ta');
  $('lead').textContent=m==='ta'
    ? LIMIT+'秒で何問とけるかな?「ま」「で」も自分でつけるよ。まちがえたら、そこでおわり。'
    : '四捨五入で、がい数にしよう。レベルをえらんでね。';
  refreshMedals();
}
$('ver').textContent=VERSION; setMode('basic');
document.querySelectorAll('.mode').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});
document.querySelectorAll('.level').forEach(function(b){b.addEventListener('click',function(){start(+b.dataset.level)})});
$('backBtn').addEventListener('click',function(){show('home')});
$('backBtn2').addEventListener('click',function(){show('home')});
$('homeBtn').addEventListener('click',function(){show('home')});
$('againBtn').addEventListener('click',function(){start(st.level)});
$('goBtn').addEventListener('click',go);

$('tiles').addEventListener('click',function(ev){
  if(st.step>1) return;
  var t=ev.target.closest('.tile'); if(!t) return;
  var q=st.q, e=+t.dataset.e;
  if(st.step===0){ // 「ま」「で」をつける
    if(e===(st.md===0?q.p:q.r)){
      st.md++;
      // タイムアタックは「で」をつけたら、そのまま四捨五入する位が見つかったことにして0を出す
      if(st.md===2) st.step=st.mode==='ta'?4:1;
      renderTiles(); renderStep();
    }
    else{
      t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
      hint(st.md===1 ? '「で」は、「ま」の<b>1つ右</b>の数字につけるよ。'
        : q.k ? '上から'+q.k+'けたのがい数だから、<b>上から'+q.k+'けた目</b>に「ま」をつけるよ。'
        : '「'+PLACE[q.p]+'の位まで」だから、<b>'+PLACE[q.p]+'の位</b>の数字に「ま」をつけるよ。');
    }
    return;
  }
  if(e===q.r){ st.step=st.mode==='ta'?4:2; renderTiles(); renderStep(); }
  else{
    t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    hint(q.k
      ? '上から'+q.k+'けたのがい数だから、<b>上から'+(q.k+1)+'けた目</b>を四捨五入するよ。'
      : '「'+PLACE[q.p]+'の位まで」のがい数にするときは、その<b>1つ下の位</b>を四捨五入するよ。');
  }
});

$('b2').addEventListener('click',function(ev){
  var b=ev.target.closest('.btn'); if(!b||st.step!==2) return;
  var q=st.q;
  if((b.dataset.up==='1')===q.up){ st.step=4; renderTiles(); renderStep(); }
  else{ b.classList.add('wrong'); hint(q.digit+' は、0〜4と5〜9のどちらに入るかな? 0〜4なら切り捨て、5〜9なら切り上げだよ。'); }
});

$('b4').addEventListener('click',function(ev){
  var b=ev.target.closest('.btn'); if(!b||st.step!==4) return;
  var q=st.q, d=+b.dataset.d;
  if(d===q.ad){ finishQ(); return; }
  b.classList.add('wrong');
  hint(q.up?'切り上げだから、'+PLACE[q.p]+'の位の '+q.pd+' に1をたすよ。':'切り捨てだから、'+PLACE[q.p]+'の位の数字は '+q.pd+' のままだよ。');
});

// レベル5・6の操作
$('xsteps').addEventListener('click',function(ev){
  if(st.level<5||(st.mode==='ta'&&!st.run)) return;
  var q=st.q, S=q.steps[st.xs]; if(!S) return;
  var b=ev.target.closest('button'); if(!b||!b.closest('#xb'+(st.xs+1))) return;
  if(S.type==='ox'&&b.dataset.j!==undefined){
    var j=+b.dataset.j, it=S.items[j];
    if((b.dataset.v==='1')===it.ok){
      st.xd[j]=true; $('hint')&&($('hint').innerHTML='');
      if(S.items.every(function(_,i){return st.xd[i]})) nextX(); else renderX();
    }else{
      var row=b.closest('.oxrow'); row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
      hint(S.why(it.n));
    }
  }else if(S.type==='pick'&&b.dataset.c!==undefined){
    var A=S.asks[st.xa], c=A.ch[+b.dataset.c];
    if(c===A.ans){
      st.xp.push(c); st.xa++;
      if(st.xa>=S.asks.length){ nextX(); } else renderX();
    }else{ b.classList.add('wrong'); hint(A.why||S.why(c)); }
  }
});

$('nextBtn').addEventListener('click',function(){
  st.idx++;
  if(st.idx<TOTAL){ newQ(); window.scrollTo(0,0); }
  else{
    $('doneScore').textContent=st.score; $('doneUnit').textContent=' / '+TOTAL+'問';
    $('doneNote').textContent='1回で正かいできた問題の数';
    $('doneAns').classList.add('hidden'); $('doneBest').classList.add('hidden'); $('doneMedal').classList.add('hidden');
    $('doneMsg').textContent=st.score===TOTAL?'ぜんぶ1回で正かい! すばらしい!':st.score>=7?'よくできました!':'さいごまでがんばったね!';
    show('done');
  }
});
})();
</script>
